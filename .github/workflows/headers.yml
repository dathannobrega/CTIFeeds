name: Production headers

# RNF-02: confere HTTPS, HSTS, CSP e demais headers servidos em produção.
# Só roda depois que a variável de repositório PRODUCTION_URL for definida
# (Settings → Secrets and variables → Actions → Variables), ex.: https://www.datan.com.br
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-headers.ts "${{ vars.PRODUCTION_URL }}"
